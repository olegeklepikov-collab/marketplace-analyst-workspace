<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подборки</title><style>body{font:17px/1.55 -apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#20252a;max-width:1200px;margin:auto;padding:26px}a{color:#064c94}table{border-collapse:collapse;width:100%}th,td{border:1px solid #d9dfe5;padding:9px;text-align:left;vertical-align:top}th{background:#edf1f4}input,button{font:inherit;padding:9px}input{width:min(95%,700px)}details{margin:16px 0;padding:12px;border:1px solid #d9dfe5}pre{white-space:pre-wrap;overflow-wrap:anywhere}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.gallery img{width:100%;height:280px;object-fit:contain}.muted{color:#58636c}.scroll{overflow:auto}.notice{padding:12px;background:#fff2d9}.reading{max-width:860px;margin:auto}.doc-image{max-width:100%;height:auto}nav a{display:inline-block;margin:3px 6px 3px 0}a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #275da8;outline-offset:3px}.doc-toc li{margin:5px 0}</style><body><nav><a href="../%D0%9E%D0%A2%D0%9A%D0%A0%D0%AB%D0%A2%D0%AC.html">Карточки</a> · <a href="../00_%D0%9C%D0%B5%D1%82%D0%BE%D0%B4%D0%B8%D0%BA%D0%B0/%D0%9E%D0%A2%D0%9A%D0%A0%D0%AB%D0%A2%D0%AC.html">Методика</a> · <a href="../03_%D0%A0%D0%B0%D0%B1%D0%BE%D1%82%D0%B0%20%D0%B0%D0%BD%D0%B0%D0%BB%D0%B8%D1%82%D0%B8%D0%BA%D0%BE%D0%B2/%D0%9E%D0%A2%D0%9A%D0%A0%D0%AB%D0%A2%D0%AC.html">Работы</a> · <a href="../README.html">Как работать</a></nav><h1>Подборки</h1><p><a href="%D0%A0%D0%B0%D0%B1%D0%BE%D1%87%D0%B8%D0%B5%20%D0%BF%D0%BE%D0%B4%D0%B1%D0%BE%D1%80%D0%BA%D0%B8/%D0%9E%D0%A2%D0%9A%D0%A0%D0%AB%D0%A2%D0%AC.html">Открыть подборки по площадке, бренду, продавцу, задаче и предложению</a></p><script>const q=document.getElementById('q');if(q)q.addEventListener('input',()=>{const v=q.value.toLocaleLowerCase().trim();let n=0;document.querySelectorAll('[data-search]').forEach(r=>{r.hidden=!r.dataset.search.includes(v);if(!r.hidden)n++});document.getElementById('count').textContent=n;document.querySelectorAll('details').forEach(d=>{const rows=d.querySelectorAll('[data-search]');if(rows.length)d.open=Boolean(v)&&Array.from(rows).some(r=>!r.hidden)})})</script></body></html>
